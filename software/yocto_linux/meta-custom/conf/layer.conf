# layer.conf -- meta-custom layer for Phase B Agilex 5 dev kit firmware
#
# Add this layer to your Yocto build by appending its path to
# conf/bblayers.conf:
#     BBLAYERS += "<path>/software/yocto_linux/meta-custom"

# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# Recipes
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-custom"
BBFILE_PATTERN_meta-custom = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-custom = "6"

LAYERSERIES_COMPAT_meta-custom = "kirkstone scarthgap nanbield"
